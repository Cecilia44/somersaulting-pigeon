[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zebrafish-3d-tracking"
version = "0.1.0"
description = "Reproducible two-view SAM 2 zebrafish tracking and 3D trajectory reconstruction"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy==2.2.4",
  "matplotlib==3.10.1",
  "opencv-python==4.11.0.86",
  "Pillow==11.1.0",
]

[project.optional-dependencies]
tracking = [
  "torch==2.6.0",
  "torchvision==0.21.0",
  "SAM-2 @ git+https://github.com/facebookresearch/sam2.git@2b90b9f5ceec907a1c18123530e92e794ad901a4",
]

[project.scripts]
zebrafish3d = "zebrafish3d.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

